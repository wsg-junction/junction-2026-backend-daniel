name: Build and push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: ai-proxy
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-proxy:${{ github.sha }}
  DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    environment: prod

    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to Verda instance
        run: |
          scp deploy/compose.yml "$DEPLOY_TARGET:/opt/ai-proxy/"
          ssh "$DEPLOY_TARGET" "cd /opt/ai-proxy \
            && sed -i '/^APP_IMAGE=/d' .env \
            && echo 'APP_IMAGE=${{ env.IMAGE }}' >> .env \
            && docker compose pull app \
            && docker compose up -d \
            && docker image prune -f"
